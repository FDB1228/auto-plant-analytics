version: 2

models:
  - name: dim_date
    description: Производственный календарь (РФ) с признаками рабочего дня и «штурмовщины» (последние 3 рабочих дня месяца).
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: dim_workshop
    columns:
      - name: workshop_id
        data_tests: [unique, not_null]

  - name: dim_section
    description: Участки с цехом, текущим начальником (NULL - вакансия) и группой пилота WS-2.
    columns:
      - name: section_id
        data_tests: [unique, not_null]
      - name: ws2_group
        data_tests:
          - accepted_values:
              arguments:
                values: [pilot, control]

  - name: dim_brigade
    columns:
      - name: brigade_id
        data_tests: [unique, not_null]

  - name: dim_model
    description: Модели изделий. Атрибуты категорий (EAV) развёрнуты в колонки и собраны в строку specs.
    columns:
      - name: model_id
        data_tests: [unique, not_null]

  - name: dim_employee
    description: SCD2-измерение сотрудников (снапшот dbt). Одна строка - одна версия атрибутов.
    columns:
      - name: employee_version_key
        data_tests: [unique, not_null]

  - name: fct_operations
    description: >
      Операции (зерно: одна операция, включая доработки). Инкрементальная модель:
      пересчитывается 3-дневное окно и «поздние» факты - операции, дефект которых
      обнаружили позже на испытаниях.
    columns:
      - name: operation_id
        data_tests: [unique, not_null]
      - name: caused_defect
        description: Операция прослежена как источник дефекта (обнаруженного на линии или на испытаниях).
      - name: brigade_newcomer_share
        description: Доля членов бригады со стажем меньше 90 дней на дату работ.
      - name: std_to_actual_ratio
        description: Норматив / факт (выполнение норм). Для доработок не считается.
      - name: brigade_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_brigade')
                field: brigade_id

  - name: fct_tests
    columns:
      - name: test_id
        data_tests: [unique, not_null]

  - name: fct_defects
    columns:
      - name: defect_id
        data_tests: [unique, not_null]
      - name: rework_cost_rub
        data_tests:
          - not_null
          - expression_is_true:
              arguments:
                expression: "rework_cost_rub >= 0"

  - name: fct_units
    description: >
      Накопительный снапшот экземпляров: вехи (запуск, сборка, приёмка, отгрузка), качество
      с первого раза (FPY), затраты на доработку, гарантийные случаи.
    columns:
      - name: unit_id
        data_tests: [unique, not_null]
      - name: serial_no
        data_tests: [unique, not_null]
      - name: is_first_pass
        description: Изделие прошло линию без дефектов и все испытания с первой попытки (только для принятых).
      - name: total_lead_time_h
        data_tests:
          - expression_is_true:
              arguments:
                expression: "total_lead_time_h is null or total_lead_time_h > 0"

  - name: fct_warranty_claims
    columns:
      - name: claim_id
        data_tests: [unique, not_null]
      - name: status
        data_tests:
          - accepted_values:
              arguments:
                values: [submitted, approved, rejected]

  - name: fct_production_plan
    description: План-факт по месяцам и моделям (факт - принятые ОТК изделия).
    data_tests:
      - unique_combination:
          arguments:
            columns: [month_start, model_id]

  - name: fct_downtime
    columns:
      - name: downtime_id
        data_tests: [unique, not_null]
